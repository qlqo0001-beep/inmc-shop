name: inmcshop
version: '${version}'
main: com.inmc.shop.ShopPlugin
api-version: '${apiVersion}'   # build.gradle.kts 의 inmc { paper } 에서 유도됨
description: INMC 상점 - 서버 상점(시장 가격)·상자 상점·경매장
authors: [ INMC ]

# 연동은 전부 load: OMIT 이다. BEFORE 를 걸면 Paper 가 의존성 순환을 보고 우리 간선을
# 조용히 끊는다 (가이드 함정 1).
dependencies:
  server:
    # 필수 의존은 이것 하나뿐. core 가 kotlin-stdlib 과 공용 프레임워크를 들고 있다.
    inmc-core:        { load: BEFORE, required: true,  join-classpath: true }
    inmc-economy:     { load: OMIT,   required: false, join-classpath: true }
    inmc-customitems: { load: OMIT,   required: false, join-classpath: true }
    PlaceholderAPI:   { load: OMIT,   required: false, join-classpath: true }
    Lands:            { load: OMIT,   required: false, join-classpath: true }

# commands 절은 paper-plugin.yml 에 없다 - Brigadier 로 등록한다.
# 선언하지 않은 권한은 Bukkit 이 OP 전용으로 다룬다 — 코드가 쓰는 노드는 전부 여기 있어야 한다(ResourceTest).
permissions:
  # --- 서버 상점 ----------------------------------------------------------------------------
  inmcshop.virtual.shop.*:
    description: 모든 서버 상점 쓰기(권한이 필요한 상점 포함)
    default: op
  inmcshop.virtual.command.menu:
    description: /상점 — 메인 메뉴
    default: true
  inmcshop.virtual.command.menu.others:
    description: /상점 열기 <상점> <플레이어> — 남에게 열기
    default: op
  inmcshop.virtual.command.open:
    description: /상점 <상점> — 상점 바로 열기
    default: true
  inmcshop.virtual.command.open.others:
    description: 남에게 상점 열기
    default: op
  inmcshop.virtual.command.shop:
    description: 상점별 단축 명령어
    default: true
  inmcshop.virtual.command.sellmenu:
    description: /판매 — 판매 창
    default: true
  inmcshop.virtual.command.sellmenu.others:
    description: 남에게 판매 창 열기
    default: op
  inmcshop.virtual.command.sellall:
    description: /전부판매
    default: true
  inmcshop.virtual.command.sellall.others:
    description: 남의 가방 전부 팔기
    default: op
  inmcshop.virtual.command.sellhand:
    description: /손판매
    default: true
  inmcshop.virtual.command.sellhand.others:
    description: 남의 손 팔기
    default: op
  inmcshop.virtual.command.sellhandall:
    description: /같은것판매
    default: true
  inmcshop.virtual.command.sellhandall.others:
    description: 남의 같은 것 팔기
    default: op
  inmcshop.virtual.command.editor:
    description: /상점 관리 — 서버 상점 편집
    default: op
  inmcshop.virtual.command.rotate:
    description: /상점 회전 — 회전 강제
    default: op
  inmcshop.key.sellall:
    description: 상점 화면의 "전부 판매" 버튼
    default: true

  # --- 상자 상점 ----------------------------------------------------------------------------
  inmcshop.chestshop.create:
    description: 상자 상점 만들기
    default: true
  inmcshop.chestshop.remove:
    description: 내 상자 상점 지우기
    default: true
  inmcshop.chestshop.remove.others:
    description: 남의 상자 상점 지우기
    default: op
  inmcshop.chestshop.edit.others:
    description: 남의 상자 상점 관리 화면 열기
    default: op
  inmcshop.chestshop.rent:
    description: 내 상자 상점 임대 설정
    default: true
  inmcshop.chestshop.teleport:
    description: 내 상자 상점으로 이동
    default: true
  inmcshop.chestshop.teleport.others:
    description: 남의 상자 상점으로 이동
    default: true
  inmcshop.chestshop.type.admin:
    description: 관리자 상점(재고·돈 무한) 전환
    default: op
  inmcshop.chestshop.disable.buying:
    description: 내 상품의 구매 끄기
    default: true
  inmcshop.chestshop.disable.selling:
    description: 내 상품의 판매 끄기
    default: true
  inmcshop.chestshop.display.customization:
    description: 홀로그램·쇼케이스 바꾸기
    default: true
  inmcshop.chestshop.bypass.creation.claims:
    description: 자기 땅 밖에도 상자 상점 만들기
    default: op
  inmcshop.chestshop.command.list:
    description: /상자상점 목록
    default: true
  inmcshop.chestshop.command.browse:
    description: /상자상점 둘러보기 · 전체목록
    default: true
  inmcshop.chestshop.command.search:
    description: /상자상점 검색 · 주인검색
    default: true
  inmcshop.chestshop.command.bank:
    description: /상자상점 은행
    default: true
  inmcshop.chestshop.command.bank.others:
    description: 남의 상점 은행 보기
    default: op
  inmcshop.chestshop.command.giveitem:
    description: /상자상점 지급 — 상점 블록 아이템
    default: op

  # --- 경매장 ------------------------------------------------------------------------------
  inmcshop.auction.command.open:
    description: /경매장
    default: true
  inmcshop.auction.command.open.others:
    description: 남에게 경매장 열기
    default: op
  inmcshop.auction.command.sell:
    description: 경매장에 물건 올리기
    default: true
  inmcshop.auction.command.selling:
    description: /경매장 판매중
    default: true
  inmcshop.auction.command.selling.others:
    description: 남의 판매 중 목록
    default: op
  inmcshop.auction.command.unclaimed:
    description: /경매장 미수령
    default: true
  inmcshop.auction.command.unclaimed.others:
    description: 남의 미수령 목록
    default: op
  inmcshop.auction.command.expired:
    description: /경매장 만료
    default: true
  inmcshop.auction.command.expired.others:
    description: 남의 만료 목록
    default: op
  inmcshop.auction.command.history:
    description: /경매장 기록
    default: true
  inmcshop.auction.command.history.others:
    description: 남의 판매 기록
    default: op
  inmcshop.auction.listing.remove.others:
    description: 남의 등록 내리기(경고 포함)
    default: op
  inmcshop.auction.warnings:
    description: /경매장 경고 — 경고·벌칙 보기와 지우기
    default: op
  inmcshop.auction.bypass.listing.tax:
    description: 경매 수수료 면제
    default: op
  inmcshop.auction.bypass.listing.price:
    description: 경매 가격 한도 무시
    default: op

  # --- 공통 --------------------------------------------------------------------------------
  inmcshop.bypass.worlds:
    description: 허용 월드 밖에서도 상점 쓰기
    default: op
  inmcshop.bypass.gamemode:
    description: 서바이벌이 아니어도 상점 쓰기
    default: op
  inmcshop.currency.*:
    description: 모든 화폐 쓰기(화폐 권한 옵션이 켜졌을 때)
    default: op
  inmcshop.reload:
    description: /상점 리로드 · 검증
    default: op
  inmcshop.verify.blocked:
    description: 검증기 전용 — 요구 조건(금지 권한) 검사에 쓴다. 누구에게도 주지 마세요
    default: false
  inmcshop.admin:
    description: 상점 관리 전체
    default: op
    children:
      inmcshop.virtual.shop.*: true
      inmcshop.virtual.command.editor: true
      inmcshop.virtual.command.rotate: true
      inmcshop.virtual.command.menu.others: true
      inmcshop.virtual.command.open.others: true
      inmcshop.virtual.command.sellmenu.others: true
      inmcshop.virtual.command.sellall.others: true
      inmcshop.virtual.command.sellhand.others: true
      inmcshop.virtual.command.sellhandall.others: true
      inmcshop.chestshop.remove.others: true
      inmcshop.chestshop.edit.others: true
      inmcshop.chestshop.type.admin: true
      inmcshop.chestshop.bypass.creation.claims: true
      inmcshop.chestshop.command.bank.others: true
      inmcshop.chestshop.command.giveitem: true
      inmcshop.auction.command.open.others: true
      inmcshop.auction.command.selling.others: true
      inmcshop.auction.command.unclaimed.others: true
      inmcshop.auction.command.expired.others: true
      inmcshop.auction.command.history.others: true
      inmcshop.auction.listing.remove.others: true
      inmcshop.auction.warnings: true
      inmcshop.bypass.worlds: true
      inmcshop.bypass.gamemode: true
      inmcshop.currency.*: true
      inmcshop.reload: true
